# generated by tools/map_bond.py from bond.toml
# Hand-kept recompiler config for bond_eng (the file the build reads). bond_game.toml is xbe_symbols output: nothing is edited
# there; hand entries go below ([[hook]], [[function]], [[switch]], [functions], [xbe] data_ranges / trace). A symbol
# found by hand is signed into the SDK, then every xbe rescanned (each rescan must reproduce its scan file).
includes = ["bond_usa_game.toml"]

[xbe]
library = "AgentUnderFireBond.dll"  # the game code DLL; this config is the one the build on the player's PC reads

# XDK 4039: named from PGR1's (3948), NightFire's (4831) and PGR2's (5659) bodies, aligned in link order, or by hand from
# the instructions (methods pushed, device fields, ret size); .local/a_*.txt hold the evidence

