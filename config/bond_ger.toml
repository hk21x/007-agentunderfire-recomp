D3D_IndexData                  = 0x1A0124  # SetIndices 0x195000+ stores the buffer data
D3D_RenderState                = 0x1A0330  # SetRenderStateNotInline 0x192EFD and 0x192F1F store it
D3D_SimpleRenderStateEncode    = 0x1F8D20  # SetRenderStateNotInline 0x192EEA reads the method
