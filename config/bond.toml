[data]
D3D_Device                     = 0x1A0640  # Direct3D_CreateDevice 0x195780+ stores it; SetRenderState_Simple 0x192EB0 reads the push pointer there
D3D_pDevice                    = 0x1A32A0  # Direct3D_CreateDevice 0x195780+ stores 0x1A0640 here
D3D_DirtyFlags                 = 0x1A01E8  # SetMaterial 0x1941E0+, SetTexture
D3D_DeferredTextureState       = 0x1A01F0  # SetTextureStageStateNotInline 0x1937F0+ stores [stage * 32 + state]
D3D_IndexData                  = 0x1A01E4  # SetIndices 0x195000+ stores the buffer data
D3D_RenderState                = 0x1A03F0  # SetRenderStateNotInline 0x192EFD and 0x192F1F store it
D3D_SimpleRenderStateEncode    = 0x1F89C8  # SetRenderStateNotInline 0x192EEA reads the method
D3D_Streams                    = 0x1A32B0  # SetStreamSource 0x197190+

